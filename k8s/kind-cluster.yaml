apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: micrositio
networking:
  disableDefaultCNI: true
  podSubnet: '192.168.0.0/16'
  serviceSubnet: '10.96.0.0/16'
  kubeProxyMode: 'iptables'

nodes:
  - role: control-plane
    image: kindest/node:v1.31.0
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"

  - role: worker
    image: kindest/node:v1.31.0
    labels:
      workload: app

  - role: worker
    image: kindest/node:v1.31.0
    labels:
      workload: data
