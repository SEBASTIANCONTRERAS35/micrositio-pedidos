# ═══════════════════════════════════════════════════════════════════
# Rollout del API con estrategia Canary 10% -> 50% -> 100%
# REEMPLAZA al Deployment del API (no aplicar ambos)
# ═══════════════════════════════════════════════════════════════════
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: micrositio
  labels:
    app: api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: api
  strategy:
    canary:
      maxSurge: 1
      maxUnavailable: 0
      steps:
        - setWeight: 10
        - pause: { duration: 2m }
        - setWeight: 50
        - pause: { duration: 2m }
        - setWeight: 100
      analysis:
        templates:
          - templateName: api-error-rate
        startingStep: 2 # empieza analisis al llegar al 50%
        args:
          - name: service-name
            value: api
  template:
    metadata:
      labels:
        app: api
        component: backend
        tier: frontend
    spec:
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api
          image: 10.211.55.30:30500/micrositio-api:latest
          imagePullPolicy: Always
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - { secretRef: { name: api-env } }
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: '3000' }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            periodSeconds: 3
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: jwt-secrets, mountPath: /secrets, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: jwt-secrets
          secret: { secretName: api-jwt, defaultMode: 0400 }
        - name: tmp
          emptyDir: {}
