# ═══════════════════════════════════════════════════════════════════
# Secret con par RSA para JWT RS256
# Generar par real:
#   openssl genrsa -out jwt-private.pem 2048
#   openssl rsa -in jwt-private.pem -pubout -out jwt-public.pem
#
# Crear secret:
#   kubectl create secret generic api-jwt \
#     --from-file=jwt-private.pem=jwt-private.pem \
#     --from-file=jwt-public.pem=jwt-public.pem \
#     -n micrositio --dry-run=client -o yaml | \
#     kubeseal --cert /tmp/sealed-secrets-cert.pem -o yaml \
#     > k8s/api/secret-jwt.sealedsecret.yaml
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: api-jwt
  namespace: micrositio
type: Opaque
data:
  jwt-private.pem: <BASE64-DE-PRIVATE-KEY>
  jwt-public.pem: <BASE64-DE-PUBLIC-KEY>
