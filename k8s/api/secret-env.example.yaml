# ═══════════════════════════════════════════════════════════════════
# Secret con variables de entorno del API
# Cifrar con kubeseal antes de committear
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: api-env
  namespace: micrositio
type: Opaque
stringData:
  # MongoDB
  MONGODB_URI: "mongodb://app:CAMBIAR-PASS@mongodb-0.mongodb-headless.micrositio.svc:27017,mongodb-1.mongodb-headless.micrositio.svc:27017,mongodb-2.mongodb-headless.micrositio.svc:27017/micrositio?replicaSet=rs0&authSource=micrositio"

  # Redis
  REDIS_HOST: "redis.micrositio.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CAMBIAR-PASS"

  # JWT (montados como archivos en /secrets/)
  JWT_PRIVATE_KEY_PATH: "/secrets/jwt-private.pem"
  JWT_PUBLIC_KEY_PATH: "/secrets/jwt-public.pem"

  # Notificaciones
  RESEND_API_KEY: ""
  RESEND_FROM_EMAIL: "pedidos@zuyu.local"
  TWILIO_ACCOUNT_SID: ""
  TWILIO_AUTH_TOKEN: ""
  TWILIO_WHATSAPP_FROM: "whatsapp:+14155238886"

  # Delivery providers (mock por defecto en demo)
  IVOY_USER: "integracion-express@ivoy.mx"
  IVOY_PASSWORD: "sandbox"
  IVOY_BASE_URL: "https://sandbox.ivoy.mx/api"
  IVOY_MOCK: "false"
  LALAMOVE_MOCK: "true"
  UBER_MOCK: "true"

  # Webhooks
  WEBHOOK_SECRET_IVOY: "CAMBIAR-SECRET-RANDOM"
  WEBHOOK_SECRET_LALAMOVE: "CAMBIAR-SECRET-RANDOM"
  WEBHOOK_SECRET_UBER: "CAMBIAR-SECRET-RANDOM"
