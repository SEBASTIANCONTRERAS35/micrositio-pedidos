# ═══════════════════════════════════════════════════════════════════
# ClusterIssuer que firma certificados con el CA propio
# Este es el que usa el Ingress para zuyu.local
# ═══════════════════════════════════════════════════════════════════
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ca-issuer
spec:
  ca:
    secretName: root-ca
