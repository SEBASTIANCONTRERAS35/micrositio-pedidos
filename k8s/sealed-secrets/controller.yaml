# Sealed Secrets controller (Bitnami) v0.27.x
# Aplicar UNA VEZ por cluster: kubectl apply -f k8s/sealed-secrets/controller.yaml
#
# Después de instalado, convierte tus Secrets a SealedSecrets con kubeseal:
#
#   # 1. Crear secret normal localmente (NO commitearlo):
#   kubectl create secret generic api-env -n micrositio \
#     --from-literal=REDIS_PASSWORD=... \
#     --dry-run=client -o yaml > /tmp/api-env.yaml
#
#   # 2. Sellar con la public key del controller:
#   kubeseal --cert /tmp/sealed-secrets-cert.pem \
#     -o yaml < /tmp/api-env.yaml > k8s/secrets/api-env.sealedsecret.yaml
#
#   # 3. Commit el sealedsecret.yaml — el controller lo desencripta dentro del cluster
#
# Ver: https://github.com/bitnami-labs/sealed-secrets
apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: Namespace
    metadata:
      name: sealed-secrets
  # El controller real se aplica desde el release oficial:
  # kubectl apply -f https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.27.1/controller.yaml
