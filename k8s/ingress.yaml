# ═══════════════════════════════════════════════════════════════════
# Certificado para zuyu.local firmado por nuestro CA propio
# ═══════════════════════════════════════════════════════════════════
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: zuyu-local-tls
  namespace: micrositio
spec:
  secretName: zuyu-local-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  commonName: zuyu.local
  dnsNames:
    - zuyu.local
  duration: 8760h   # 1 ano
  renewBefore: 720h
---
# ═══════════════════════════════════════════════════════════════════
# Ingress nginx con TLS terminado en el ingress
# ═══════════════════════════════════════════════════════════════════
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: micrositio
  namespace: micrositio
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "30"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "30"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - zuyu.local
      secretName: zuyu-local-tls
  rules:
    - host: zuyu.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
