apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: micrositio
data:
  redis.conf: |
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300

    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command CONFIG ""
    rename-command DEBUG ""
    rename-command SHUTDOWN "SHUTDOWN_b1c8d4f2"

    appendonly yes
    appendfsync everysec
    save 900 1
    save 300 10
    save 60 10000

    maxmemory 200mb
    maxmemory-policy noeviction

    loglevel notice

    slowlog-log-slower-than 10000
    slowlog-max-len 128
