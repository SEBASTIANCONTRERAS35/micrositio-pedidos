# ═══════════════════════════════════════════════════════════════════
# Secret con password de Redis y ACLs
# Cifrar con kubeseal antes de committear
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: redis-auth
  namespace: micrositio
type: Opaque
stringData:
  REDIS_PASSWORD: changeme-redis-strong-password
  REDIS_APP_PASSWORD: changeme-app-redis-password
  REDIS_WORKER_PASSWORD: changeme-worker-redis-password
