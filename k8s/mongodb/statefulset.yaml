# ═══════════════════════════════════════════════════════════════════
# MongoDB StatefulSet — 3 nodos en Replica Set rs0
# Storage: nfs-csi (ReadWriteOnce, 5Gi por pod)
# Auth: SCRAM-SHA-256 + keyfile interno
# ═══════════════════════════════════════════════════════════════════
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: micrositio
  labels:
    app: mongodb
    component: database
spec:
  serviceName: mongodb-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
        component: database
    spec:
      serviceAccountName: mongodb-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Copiar keyfile y dar permisos correctos (debe ser 400 owned by mongodb)
        - name: copy-keyfile
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /raw-secrets/mongodb.key /etc/mongodb/keyfile
              chmod 400 /etc/mongodb/keyfile
              chown 999:999 /etc/mongodb/keyfile
          securityContext:
            runAsUser: 0  # Necesita root para chown
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE]
          volumeMounts:
            - name: keyfile-raw
              mountPath: /raw-secrets
              readOnly: true
            - name: keyfile-prepared
              mountPath: /etc/mongodb
      containers:
        - name: mongodb
          image: mongo:7.0
          imagePullPolicy: IfNotPresent
          command:
            - mongod
            - --bind_ip_all
            - --replSet=rs0
            - --auth
            - --keyFile=/etc/mongodb/keyfile
            - --port=27017
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongodb-users
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-users
                  key: MONGO_INITDB_ROOT_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok || quit(1)"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok || quit(1)"
            initialDelaySeconds: 10
            periodSeconds: 5
          startupProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok || quit(1)"
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # MongoDB necesita escribir en /data/db
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: keyfile-prepared
              mountPath: /etc/mongodb
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: keyfile-raw
          secret:
            secretName: mongodb-keyfile
            defaultMode: 0400
        - name: keyfile-prepared
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: nfs-csi
        resources:
          requests:
            storage: 5Gi
