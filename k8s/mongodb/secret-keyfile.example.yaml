# ═══════════════════════════════════════════════════════════════════
# Secret con keyfile para Replica Set authentication
#
# IMPORTANTE: este es un EJEMPLO. NO subir el real al repo.
# Generar el secret real con:
#   openssl rand -base64 756 > mongodb-keyfile
#   kubectl create secret generic mongodb-keyfile \
#     --from-file=mongodb.key=mongodb-keyfile \
#     -n micrositio --dry-run=client -o yaml | \
#     kubeseal --cert /path/to/sealed-secrets-cert.pem -o yaml \
#     > mongodb/secret-keyfile.sealedsecret.yaml
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-keyfile
  namespace: micrositio
type: Opaque
data:
  mongodb.key: <BASE64-DEL-KEYFILE>
