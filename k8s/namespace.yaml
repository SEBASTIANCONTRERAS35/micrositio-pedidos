# ═══════════════════════════════════════════════════════════════════
# Namespace 'micrositio' con Pod Security Standards: Baseline
# NOTA: baseline (no restricted) porque mongodb init-container necesita
# root + CHOWN para preparar el keyfile de replica set authentication.
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Namespace
metadata:
  name: micrositio
  labels:
    name: micrositio
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
