# ═══════════════════════════════════════════════════════════════════
# Alertas Prometheus para micrositio (bonus +2 pts rubrica)
# Loaded automatically by kube-prometheus-stack via release=kps label
# ═══════════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: micrositio-alerts
  namespace: observability
  labels:
    release: kps
    app.kubernetes.io/part-of: micrositio
spec:
  groups:
    - name: micrositio.app
      interval: 30s
      rules:
        # Cola BullMQ acumulándose → KEDA debería estar escalando worker.
        # Usa worker_queue_pending (gauge que el propio worker expone en /metrics
        # vía startQueueDepthCollector). Antes usaba redis_list_length, que NO
        # existe (no hay redis-exporter desplegado) → la alerta nunca disparaba.
        - alert: RedisQueueBacklog
          expr: sum(worker_queue_pending{namespace="micrositio"}) > 100
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: 'Cola BullMQ acumulándose'
            description: 'La cola del worker tiene más de 100 jobs pendientes por 2+ min — KEDA debería estar escalando worker'

        # Error rate 5xx > 5% → posible regresión
        - alert: HighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="micrositio", status=~"5.."}[5m]))
            /
            sum(rate(http_requests_total{namespace="micrositio"}[5m])) > 0.05
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Error rate 5xx > 5%'
            description: 'API tiene más de 5% de errores 5xx en los últimos 5min — considerar rollback'

        # Pod en CrashLoopBackOff
        - alert: PodCrashLooping
          expr: rate(kube_pod_container_status_restarts_total{namespace="micrositio"}[10m]) > 0.1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: 'Pod en CrashLoopBackOff'
            description: 'Pod {{ $labels.pod }} en namespace micrositio tiene reinicios frecuentes'

        # MongoDB Replica Set: menos de 3 réplicas listas → quórum en riesgo.
        # Usa kube_statefulset_status_replicas_ready (de kube-state-metrics, que
        # SÍ está desplegado). Antes usaba mongodb_replset_member_health, que NO
        # existe (no hay mongodb-exporter) → la alerta nunca disparaba.
        - alert: MongoDBReplicaNotReady
          expr: kube_statefulset_status_replicas_ready{namespace="micrositio", statefulset="mongodb"} < 3
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: 'MongoDB Replica Set degradado'
            description: 'El StatefulSet mongodb tiene menos de 3 réplicas listas — quórum del Replica Set en riesgo'
