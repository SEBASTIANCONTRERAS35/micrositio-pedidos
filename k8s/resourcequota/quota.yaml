apiVersion: v1
kind: ResourceQuota
metadata:
  name: micrositio-quota
  namespace: micrositio
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi

    pods: "20"

    persistentvolumeclaims: "10"
    requests.storage: 50Gi

    secrets: "20"
    configmaps: "20"
    services: "10"
    services.loadbalancers: "1"
