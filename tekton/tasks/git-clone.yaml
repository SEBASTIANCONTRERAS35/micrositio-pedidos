apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: ci
spec:
  params:
    - name: url
      description: URL del repo a clonar
    - name: revision
      description: rama o commit
      default: main
  workspaces:
    - name: source
      description: workspace donde se clona (en el subdir repo/)
  steps:
    - name: clone
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -e
        cd "$(workspaces.source.path)"
        rm -rf repo
        git clone --depth 1 --branch "$(params.revision)" "$(params.url)" repo
        cd repo && git log -1 --oneline
