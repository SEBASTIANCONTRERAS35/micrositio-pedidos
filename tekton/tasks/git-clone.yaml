apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: git-clone
  namespace: ci
spec:
  params:
    - name: url
      description: URL del repo a clonar
    - name: revision
      description: rama o commit
      default: main
  workspaces:
    - name: source
      description: workspace donde se clona (en el subdir repo/)
  steps:
    - name: clone
      image: alpine/git:2.43.0
      script: |
        #!/bin/sh
        set -e
        cd "$(workspaces.source.path)"
        rm -rf repo
        mkdir repo && cd repo
        git init -q
        git remote add origin "$(params.url)"
        git fetch --depth 1 origin "$(params.revision)"
        git checkout -q FETCH_HEAD
        git log -1 --oneline
