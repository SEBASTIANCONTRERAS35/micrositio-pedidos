apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: trivy-scan
  namespace: ci
spec:
  params:
    - name: target
      description: 'fs (filesystem) o image'
      default: fs
    - name: path-or-image
      description: 'path para fs o image:tag para image'
  workspaces:
    - name: source
  steps:
    - name: scan
      image: aquasec/trivy:0.58.0
      script: |
        #!/bin/sh
        set -e
        if [ "$(params.target)" = "fs" ]; then
          trivy fs $(workspaces.source.path)/$(params.path-or-image) \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress
        else
          trivy image $(params.path-or-image) \
            --severity HIGH,CRITICAL --exit-code 1 --no-progress
        fi
        echo "Scan OK"
