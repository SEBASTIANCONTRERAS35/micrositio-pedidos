apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: micrositio-build
  namespace: ci
spec:
  params:
    - name: repo-url
      default: 'https://github.com/SEBASTIANCONTRERAS35/micrositio-pedidos.git'
    - name: revision
      default: 'main'
    - name: image-api
      default: '10.211.55.30:30500/micrositio-api:latest'
    - name: image-worker
      default: '10.211.55.30:30500/micrositio-worker:latest'
    - name: image-api-mirror
      type: array
      default: []
    - name: image-worker-mirror
      type: array
      default: []
  workspaces:
    - name: source

  tasks:
    - name: clone
      taskRef: { name: git-clone }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    - name: build-api
      runAfter: [clone]
      taskRef: { name: kaniko-build }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: image, value: $(params.image-api) }
        - { name: dockerfile, value: api/Dockerfile }
        - { name: target, value: production }
        - name: extra-destinations
          value: ['$(params.image-api-mirror[*])']

    - name: build-worker
      runAfter: [build-api]
      taskRef: { name: kaniko-build }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: image, value: $(params.image-worker) }
        - { name: dockerfile, value: worker/Dockerfile }
        - { name: target, value: production }
        - name: extra-destinations
          value: ['$(params.image-worker-mirror[*])']
