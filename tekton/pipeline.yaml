# Pipeline CI del micrositio — clona el repo y construye+publica las dos
# imágenes (api y worker) en el registry local. ArgoCD detecta la imagen
# nueva y despliega (git push → build → deploy automático).
#
# Aplicar:  kubectl apply -f tekton/tasks/ -f tekton/pipeline.yaml
# Ejecutar: kubectl create -f tekton/pipelinerun-example.yaml
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: micrositio-build
  namespace: ci
spec:
  params:
    - name: repo-url
      default: 'https://github.com/SEBASTIANCONTRERAS35/micrositio-pedidos.git'
    - name: revision
      default: 'main'
    - name: image-api
      default: '10.211.55.30:30500/micrositio-api:latest'
    - name: image-worker
      default: '10.211.55.30:30500/micrositio-worker:latest'
  workspaces:
    - name: source

  tasks:
    # 1. Checkout del repo
    - name: clone
      taskRef: { name: git-clone }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: url, value: $(params.repo-url) }
        - { name: revision, value: $(params.revision) }

    # 2. Build + push imagen API
    - name: build-api
      runAfter: [clone]
      taskRef: { name: kaniko-build }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: image, value: $(params.image-api) }
        - { name: dockerfile, value: api/Dockerfile }
        - { name: target, value: production }

    # 3. Build + push imagen worker (secuencial: comparte el workspace RWO)
    - name: build-worker
      runAfter: [build-api]
      taskRef: { name: kaniko-build }
      workspaces:
        - { name: source, workspace: source }
      params:
        - { name: image, value: $(params.image-worker) }
        - { name: dockerfile, value: worker/Dockerfile }
        - { name: target, value: production }
