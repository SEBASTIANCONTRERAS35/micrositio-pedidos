# Secret HMAC que comparten GitHub y el EventListener — DOCUMENTACIÓN (no se aplica).
#
# ⚠️ Este archivo NO contiene un recurso aplicable a propósito: si tuviera un
# Secret real con el mismo name (github-webhook-secret), un `kubectl apply -f
# tekton/triggers/` del directorio completo lo sobreescribiría con un valor
# placeholder y ROMPERÍA la validación HMAC. El Secret real se sella y vive en
# k8s/sealed-secrets/github-webhook-secret.sealedsecret.yaml.
#
# ─── Cómo funciona ────────────────────────────────────────────────────────
# GitHub firma cada webhook con HMAC-SHA256 usando este secreto y lo manda en
# el header X-Hub-Signature-256. El interceptor "github" recalcula la firma con
# el mismo secreto y compara: si no coincide, rechaza el evento. Así nadie sin
# el secreto puede disparar builds falsos.
#
# ─── Estructura del Secret (referencia) ───────────────────────────────────
#   apiVersion: v1
#   kind: Secret
#   metadata:
#     name: github-webhook-secret
#     namespace: ci
#   type: Opaque
#   stringData:
#     secretToken: <salida de: openssl rand -hex 32>
#
# ─── SETUP (1 sola vez) ───────────────────────────────────────────────────
#   1. Generar secreto:
#        WEBHOOK_SECRET=$(openssl rand -hex 32)
#   2. Crear + sellar (kubeseal vive en el master):
#        kubectl create secret generic github-webhook-secret -n ci \
#          --from-literal=secretToken="$WEBHOOK_SECRET" \
#          --dry-run=client -o yaml | \
#        kubeseal --controller-namespace=kube-system \
#          --controller-name=sealed-secrets-controller --format=yaml \
#          > k8s/sealed-secrets/github-webhook-secret.sealedsecret.yaml
#   3. Aplicar: kubectl apply -f k8s/sealed-secrets/github-webhook-secret.sealedsecret.yaml
#   4. En GitHub -> Settings -> Webhooks -> Add webhook:
#        - Payload URL: https://tekton.zuyu.local/  (requiere túnel para GitHub real)
#        - Content type: application/json
#        - Secret: el valor de $WEBHOOK_SECRET
#        - Events: 'Just the push event'
#
# ─── Probar sin GitHub (demo local con curl firmado) ──────────────────────
#   SHA=$(git rev-parse HEAD)
#   PAYLOAD="{\"ref\":\"refs/heads/main\",\"after\":\"$SHA\",\"repository\":{\"clone_url\":\"<repo>.git\"}}"
#   SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$WEBHOOK_SECRET" -hex | sed 's/^.*= //')
#   curl -X POST http://<eventlistener>:8080 \
#     -H 'X-GitHub-Event: push' -H "X-Hub-Signature-256: sha256=$SIG" \
#     -H 'Content-Type: application/json' -d "$PAYLOAD"
