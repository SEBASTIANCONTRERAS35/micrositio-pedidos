# ═══════════════════════════════════════════════════════════════════
# PrometheusRule (BONUS +2 pts)
# Alertas para AlertManager
# ═══════════════════════════════════════════════════════════════════
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: micrositio-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: micrositio.api
      interval: 30s
      rules:
        - alert: ApiHighErrorRate
          expr: |
            sum(rate(http_requests_total{namespace="micrositio", app="api", status=~"5.."}[2m]))
            /
            sum(rate(http_requests_total{namespace="micrositio", app="api"}[2m])) > 0.05
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: 'Tasa de errores 5xx > 5% en API'
            description: 'Mas del 5% de las requests del API estan fallando'

        - alert: ApiHighLatency
          expr: |
            histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket{namespace="micrositio", app="api"}[2m])) by (le)) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'P99 latencia del API > 2s'

        - alert: PodRestartingFrequently
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="micrositio"}[10m]) > 0.01
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Pod {{ $labels.pod }} se reinicia frecuentemente'

    - name: micrositio.queue
      interval: 30s
      rules:
        - alert: QueueBacklogHigh
          # Gauge worker_queue_pending — expuesto por worker/metrics.js
          # (startQueueDepthCollector muestrea getJobCounts cada 15s).
          expr: |
            worker_queue_pending{queue="notificaciones"} > 100
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: 'Cola de notificaciones acumulada'
            description: 'Mas de 100 jobs pendientes en cola, KEDA deberia estar escalando'

    - name: micrositio.mongodb
      interval: 30s
      rules:
        - alert: MongoDBSinQuorum
          # Sin un mongodb-exporter dedicado usamos kube-state-metrics: las
          # réplicas READY del StatefulSet. Con menos de 2 de 3 listas el
          # Replica Set pierde quórum → no hay PRIMARY → las escrituras fallan.
          expr: |
            kube_statefulset_status_replicas_ready{namespace="micrositio", statefulset="mongodb"} < 2
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: 'MongoDB Replica Set sin quórum'
            description: 'Menos de 2 de 3 réplicas de MongoDB están listas — el RS pierde quórum y las escrituras fallan'
