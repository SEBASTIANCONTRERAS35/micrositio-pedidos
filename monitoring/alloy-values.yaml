# Helm values para grafana/alloy (reemplazo de Promtail)
# Recolecta logs de pods en namespace 'micrositio' y los envia a Loki
# Extrae el campo 'pedidoId' del JSON para hacer querys por pedido

alloy:
  configMap:
    create: true
    content: |-
      logging {
        level = "info"
        format = "json"
      }

      // Discovery: pods en namespace micrositio
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["micrositio"]
        }
      }

      // Relabeling: extraer namespace, pod, container, app
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // Source: leer logs del filesystem
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.json.receiver]
      }

      // Process: parsear JSON y extraer pedidoId como label
      loki.process "json" {
        forward_to = [loki.write.default.receiver]

        stage.json {
          expressions = {
            pedidoId  = "pedidoId",
            level     = "level",
            msg       = "msg",
            err       = "err.message",
          }
        }

        stage.labels {
          values = {
            level    = "",
            pedidoId = "",
          }
        }
      }

      // Write: enviar a Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  podLabels:
    app: alloy

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 200m, memory: 256Mi }
