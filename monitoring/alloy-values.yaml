# Helm values para grafana/alloy (reemplazo de Promtail).
# Recolecta logs de pods de TODO el cluster y los envía a Loki.
# Extrae el campo 'pedidoId' del JSON para poder hacer querys por pedido.

alloy:
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "json"
      }

      // Discovery: pods de TODOS los namespaces del cluster (sin filtro).
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Relabeling: extraer namespace, pod, container, app como labels.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          target_label  = "app"
        }
      }

      // Source: leer los logs de los pods descubiertos.
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.json.receiver]
      }

      // Process: parsear JSON y extraer pedidoId/level como labels. Solo
      // aplica a los logs JSON del micrositio; el resto del cluster (logs
      // de texto plano) pasa sin esos labels — no rompe nada.
      loki.process "json" {
        forward_to = [loki.write.default.receiver]

        stage.json {
          expressions = {
            pedidoId = "pedidoId",
            level    = "level",
            msg      = "msg",
            err      = "err.message",
          }
        }

        stage.labels {
          values = {
            level    = "",
            pedidoId = "",
          }
        }
      }

      // Write: enviar a Loki (namespace observability — donde corre Loki).
      loki.write "default" {
        endpoint {
          url = "http://loki.observability.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset
  podLabels:
    app: alloy

# Recolectar todo el cluster procesa más logs → un poco más de RAM.
resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { cpu: 300m, memory: 512Mi }
