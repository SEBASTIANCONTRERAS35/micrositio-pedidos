apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: micrositio
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/SEBASTIANCONTRERAS35/micrositio-pedidos.git
    targetRevision: main
    path: k8s
    directory:
      recurse: true
      exclude: '{**/*.example.yaml,kind-cluster.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: micrositio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      jsonPointers:
        - /spec/replicas
    - group: bitnami.com
      kind: SealedSecret
      jsonPointers:
        - /spec/encryptedData
