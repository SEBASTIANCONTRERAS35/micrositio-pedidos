# ═══════════════════════════════════════════════════════════════════
# Webhook secret para que GitHub dispare sync inmediato en ArgoCD.
#
# SETUP (1 sola vez):
#   1. Generar secret: openssl rand -hex 32 > /tmp/gh-webhook-secret
#   2. Aplicar en cluster:
#      kubectl create secret generic argocd-secret -n argocd \
#        --from-literal=webhook.github.secret="$(cat /tmp/gh-webhook-secret)" \
#        --dry-run=client -o yaml | kubectl apply -f -
#      (ArgoCD lee este key del secret 'argocd-secret' existente)
#   3. En GitHub → Settings → Webhooks → Add webhook:
#      - Payload URL: https://argocd.zuyu.local/api/webhook
#      - Content type: application/json
#      - Secret: el mismo de paso 1
#      - Events: 'Just the push event'
#      - Active ✓
#   4. Verificar: git push → ver evento en GitHub Settings → Webhooks → Recent Deliveries
#
# Sin webhook configurado, ArgoCD sigue sincronizando solo cada 3 min (default).
# CON webhook configurado, sync es INSTANTÁNEO al git push.
# ═══════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: argocd-secret-patch-EXAMPLE # SOLO referencia — usar kubectl patch del secret real
  namespace: argocd
type: Opaque
stringData:
  webhook.github.secret: 'CAMBIAR-POR-OUTPUT-DE-openssl-rand-hex-32'
